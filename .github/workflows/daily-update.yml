name: TEFAS Veri Güncelleme

# TEFAS'ın kendi (doğrudan JSON döndüren, tarayıcı gerektirmeyen) API'sini
# kullandığımız için artık hafta içi her sabah otomatik çalışır. Elle de
# tetiklenebilir: Actions sekmesinden "Run workflow".
# Çalıştığında, sistemde kayıtlı en son tarihten bugüne kadar olan tüm eksik
# iş günlerini çeker ve işler.
on:
  schedule:
    - cron: '0 7 * * 1-5'  # Hafta içi her gün 07:00 UTC (10:00 TR saati)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Eksik günleri çek ve raporu güncelle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_and_build.py

      - name: Değişiklikleri commit'le ve pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tefas_veri.json data/fon_valor.csv docs/index.html docs/karar.html docs/karsilastir.html docs/fon.html docs/disaaktar.html
          if git diff --staged --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
          else
            git commit -m "TEFAS verisi güncellendi ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      # Bu adim SADECE onceki adimlardan biri basarisiz olursa (exit code != 0)
      # calisir. GITHUB_TOKEN otomatik saglanir, ekstra secret gerekmez.
      - name: Hata durumunda GitHub Issue aç
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "TEFAS veri güncelleme başarısız: $(date -u +%F)" \
            --body "Otomatik güncelleme çalıştırması başarısız oldu. Detaylar için [bu çalıştırmayı]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) inceleyin." \
            --label "otomasyon"  || \
          gh issue create \
            --title "TEFAS veri güncelleme başarısız: $(date -u +%F)" \
            --body "Otomatik güncelleme çalıştırması başarısız oldu. Detaylar için [bu çalıştırmayı]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) inceleyin."
