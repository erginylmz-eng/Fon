name: TEFAS Veri Güncelleme (Elle Çalıştır)

# NOT: Otomatik/zamanlanmış çalıştırma KALDIRILDI. Bu workflow artık sadece
# elle tetiklendiğinde çalışır: ya bu repoda "Actions" sekmesinden
# "Run workflow" ile, ya da rapor sayfasındaki "Şimdi Çek" butonuyla.
# Çalıştığında, sistemde kayıtlı en son tarihten bugüne kadar olan tüm
# eksik iş günlerini tek tek çeker ve işler.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Eksik günleri çek ve raporu güncelle
        run: python scripts/fetch_and_build.py

      - name: Değişiklikleri commit'le ve pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tefas_veri.json data/fon_valor.csv docs/index.html docs/karar.html docs/karsilastir.html
          git diff --staged --quiet || git commit -m "TEFAS verisi güncellendi ($(date -u +%F))"
          git push
